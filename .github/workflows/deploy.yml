# Builds maps.sustenaut.eu from the state's open data and publishes it to
# Cloudflare Pages: on every push to main, every morning (to pick up the
# places sites added, areas.json's places), and by hand.
#
# The Pages project is the maps site in schryer/business-plan's
# pubkit.json (made by its infra/dns.tf). The token is the Actions secret
# CLOUDFLARE_GITHUB_API_TOKEN, which can only edit Pages; the account is
# the Actions variable CLOUDFLARE_ACCOUNT_ID. It stays off until those
# exist: set the repository variable MAPS_DEPLOY to "on".
#
# pubkit's actions/cache keeps what pubkit.json's cache block names: the
# downloaded data, kept from run to run, and each pack under a fingerprint
# of its inputs (bin/maps build --cache, through pubkit cache run). An
# area's data is fetched again only when the places in it change, so only
# then does its pack go through tippecanoe again; a new area's data is
# fetched the first time a place is in it. A pull request labelled
# "refresh cache" restores nothing once it merges, so all the data is
# fetched and every pack made anew (pubkit's actions/pr-label); so does a
# run by hand with "refresh".
name: deploy

on:
  push: { branches: [main] }
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      refresh:
        description: Restore nothing, so all the data is fetched and every pack made anew
        type: boolean
        default: false

permissions:
  contents: read
  # actions/pr-label reads the labels of the pull request a push merged.
  pull-requests: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.MAPS_DEPLOY == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tippecanoe
        run: sudo apt-get update -q && sudo apt-get install -y -q tippecanoe
      - run: make venv node
      - name: Is the merged pull request labelled "refresh cache"?
        id: label
        uses: Sustenaut/pubkit/actions/pr-label@24b6c7ba012a758fa9741c530d224ddad3f2c0dc # v0.24.0
      - name: Restore the kept data and packs (pubkit.json's cache entries)
        uses: Sustenaut/pubkit/actions/cache@24b6c7ba012a758fa9741c530d224ddad3f2c0dc # v0.24.0
        with:
          step: restore
          refresh: ${{ inputs.refresh || steps.label.outputs.present }}
      - name: Download the data
        run: bin/maps download
      - name: Build the site
        run: bin/maps build --cache
      - name: Keep the data and the packs for the next run
        uses: Sustenaut/pubkit/actions/cache@24b6c7ba012a758fa9741c530d224ddad3f2c0dc # v0.24.0
        with:
          step: save
      - uses: Sustenaut/pubkit/actions/deploy-static@24b6c7ba012a758fa9741c530d224ddad3f2c0dc # v0.24.0
        with:
          dir: _site
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_GITHUB_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-project: sustenaut-maps
      - name: Check the site
        run: |
          want=$(jq -r .overview.dir _site/index.json)
          for i in $(seq 1 30); do
            curl -fs https://sustenaut-maps.pages.dev/index.json | grep -qF "$want" && exit 0
            sleep 5
          done
          echo "sustenaut-maps.pages.dev does not serve this build's index.json" >&2
          exit 1
