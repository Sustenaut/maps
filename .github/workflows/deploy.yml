# Builds maps.sustenaut.eu from the state's open data and publishes it to
# Cloudflare Pages: on every push to main, every Monday (the data changes
# slowly, and a weekly build keeps it current), and by hand.
#
# The Pages project is the maps site in schryer/business-plan's
# pubkit.json (made by its infra/dns.tf). The token is the Actions secret
# CLOUDFLARE_GITHUB_API_TOKEN, which can only edit Pages; the account is
# the Actions variable CLOUDFLARE_ACCOUNT_ID. It stays off until those
# exist: set the repository variable MAPS_DEPLOY to "on".
#
# Two caches make a deploy that changes no data quick. The downloaded data
# is kept for the ISO week, so the Monday build fetches it fresh and a push
# later that week reuses it (run by hand with "fresh" to fetch it anyway).
# The built packs are kept under a fingerprint of their inputs, so only an
# area whose data or build changed goes through tippecanoe again
# (mapbuild/publish.py).
name: deploy

on:
  push: { branches: [main] }
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      fresh:
        description: Download the data again, even if this week's is kept
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: vars.MAPS_DEPLOY == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tippecanoe
        run: sudo apt-get update -q && sudo apt-get install -y -q tippecanoe
      - run: make venv node
      - name: The week, which names the data cache
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Keep the downloaded data for the week
        if: ${{ !inputs.fresh }}
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: data
          key: maps-data-${{ steps.week.outputs.week }}
      - name: Keep the built packs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .packcache
          key: maps-packs-${{ github.run_id }}
          restore-keys: maps-packs-
      - name: Download the data
        run: bin/maps download
      - name: Build the site
        run: bin/maps build --cache .packcache
      - uses: Sustenaut/pubkit/actions/deploy-static@16cb82e94b7fc4f56dd1d545e289994f63eaba6a # v0.17.1
        with:
          dir: _site
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_GITHUB_API_TOKEN }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          cloudflare-project: sustenaut-maps
      - name: Check the site
        run: |
          want=$(jq -r .overview.dir _site/index.json)
          for i in $(seq 1 30); do
            curl -fs https://sustenaut-maps.pages.dev/index.json | grep -qF "$want" && exit 0
            sleep 5
          done
          echo "sustenaut-maps.pages.dev does not serve this build's index.json" >&2
          exit 1
